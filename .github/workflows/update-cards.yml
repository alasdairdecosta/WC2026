name: Update World Cup card data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update cards.json from WorldCupAPI
        env:
          WORLDCUPAPI_KEY: ${{ secrets.WORLDCUPAPI_KEY }}
        run: node scripts/update-cards.mjs

      - name: Commit updated card data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards.json
          if git diff --cached --quiet; then
            echo "No card data changes to commit"
          else
            git commit -m "Update World Cup card data"
            git push
          fi
