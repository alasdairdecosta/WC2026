name: Update World Cup live and card data

on:
  workflow_dispatch:
  schedule:
    # Staggered away from :00 to reduce GitHub Actions peak-load drops/delays.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-world-cup-data.yml"
      - "scripts/update-live.mjs"
      - "scripts/update-cards.mjs"

permissions:
  contents: write

concurrency:
  group: world-cup-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Show trigger
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          date -u

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update live scores
        run: node ./scripts/update-live.mjs

      - name: Update card data
        run: node ./scripts/update-cards.mjs

      - name: Show diagnostics
        run: |
          echo "live.json diagnostics:"
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('live.json','utf8')); console.log(JSON.stringify(j.diagnostics || {}, null, 2));"
          echo "cards.json diagnostics:"
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('cards.json','utf8')); console.log(JSON.stringify(j.diagnostics || j.meta || {}, null, 2));"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json cards.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Update World Cup live and card data"
            git push
          fi
