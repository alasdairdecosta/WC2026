name: Update World Cup live data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/2 * * * *'

permissions:
  contents: write

jobs:
  update-live:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update live.json from WorldCup26
        shell: bash
        run: node ./scripts/update-live.mjs

      - name: Commit updated live data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then
            echo "No live data changes to commit"
          else
            git commit -m "Update World Cup live data"
            git push
          fi
